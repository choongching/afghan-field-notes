<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://unpkg.com https://server.arcgisonline.com; connect-src 'self' https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Check in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Reenie+Beanie&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --paper: #ebe7dd; --ink: #37332e; --red: #b8432f; --green: #5f8c4e; --line: rgb(55 51 46 / .35); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 16px/1.4 Inter, system-ui, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 22px 16px 60px; }
  h1 { font: 22px "Architects Daughter", cursive; letter-spacing: .22em; text-transform: uppercase; margin: 6px 0 2px; -webkit-text-stroke: .03em currentColor; }
  .rule { display: block; width: 190px; height: 3px; background: var(--ink); opacity: .7; border-radius: 2px; transform: rotate(-.6deg); margin-bottom: 18px; }
  label, .k { display: block; font: 13px "Architects Daughter", cursive; letter-spacing: .14em; text-transform: uppercase; margin: 18px 0 4px; }
  input[type=text], input[type=password], textarea {
    width: 100%; font: 24px/1.2 "Reenie Beanie", cursive; color: var(--ink); background: transparent; border: 0;
    border-bottom: 1.5px solid var(--line); padding: 4px 2px; outline: none; border-radius: 0; }
  input:focus, textarea:focus { border-bottom-color: var(--ink); }
  textarea { resize: vertical; min-height: 54px; }
  .row { display: flex; gap: 8px; align-items: end; }
  .row input { flex: 1; }
  button { font: 600 14px Inter, sans-serif; color: var(--ink); background: rgb(255 255 255 / .6); border: 1.5px solid var(--ink); border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  button.primary { background: var(--ink); color: var(--paper); width: 100%; padding: 14px; font-size: 16px; margin-top: 22px; }
  button.quiet { border-color: var(--line); background: transparent; font-weight: 400; }
  button:disabled { opacity: .45; cursor: default; }
  .hint { font: 18px/1.2 "Reenie Beanie", cursive; opacity: .7; margin-top: 4px; }
  .cands { display: grid; gap: 6px; margin-top: 8px; }
  .cands button { text-align: left; border-radius: 10px; font-weight: 400; }
  .cands button small { display: block; opacity: .6; font-size: 12px; margin-top: 2px; }
  #map { height: 220px; margin-top: 12px; border: 1.5px solid var(--line); border-radius: 6px; }
  #map[hidden] { display: none; }
  .near { font: 22px/1.2 "Reenie Beanie", cursive; margin-top: 6px; min-height: 26px; }
  .near small { font: 12px Inter, sans-serif; opacity: .6; }
  .show { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .show label { margin: 0; display: flex; gap: 8px; align-items: center; font: 15px Inter, sans-serif; letter-spacing: 0; text-transform: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 10px; cursor: pointer; }
  .show label:has(input:checked) { border-color: var(--ink); background: rgb(255 255 255 / .5); }
  .show small { display: block; opacity: .6; font-size: 11.5px; }
  .status { margin-top: 14px; font: 20px/1.25 "Reenie Beanie", cursive; min-height: 24px; }
  .status.err { color: var(--red); }
  .status.ok { color: #3d6b3a; }
  .after { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .form[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Check in</h1><span class="rule"></span>

  <form class="form" id="form" autocomplete="off">
    <label for="where">Where are you?</label>
    <div class="row"><input type="text" id="where" placeholder="Band-e Amir, Bamyan  ·  or 34.84, 67.23" enterkeyhint="search"><button type="button" id="find">Find</button></div>
    <div class="hint">a town, place or street — or coordinates / a full Google Maps link</div>
    <div class="cands" id="cands"></div>
    <div id="map" hidden></div>
    <div class="near" id="near"></div>

    <label for="note">Note <span style="opacity:.6">(public)</span></label>
    <textarea id="note" maxlength="200" placeholder="tea by the lake"></textarea>

    <span class="k">Show on the public map</span>
    <div class="show">
      <label><input type="radio" name="show" value="town" checked><span>Town<small>snapped to the town</small></span></label>
      <label><input type="radio" name="show" value="region"><span>Province<small>only the province</small></span></label>
      <label><input type="radio" name="show" value="exact"><span>Exact<small>the pin itself</small></span></label>
      <label><input type="radio" name="show" value="hidden"><span>Hidden<small>keep it private</small></span></label>
    </div>

    <button type="submit" class="primary" id="go" disabled>Check in</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="after"><button type="button" class="quiet" id="undo">Undo last check-in</button></div>
  </form>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="./checkin.js"></script>
</body>
</html>
